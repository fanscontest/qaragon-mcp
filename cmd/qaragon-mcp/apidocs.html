<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1120" />
    <title>Qaragon API Reference</title>
    <link rel="stylesheet" href="/docs-assets/swagger-ui.css" />
    <style>
      html { background: #0b1120; }
      body { margin: 0; background: #0b1120; color: #e2e8f0; }
      .masthead {
        display: flex; align-items: center; justify-content: space-between; gap: 1rem;
        padding: 1rem clamp(1rem, 4vw, 3.5rem); border-bottom: 1px solid #263247;
        background: #0b1120;
      }
      .brand { color: #f8fafc; font: 650 1rem/1.2 system-ui, sans-serif; letter-spacing: .01em; }
      .brand span { color: #a78bfa; }
      .contract-link {
        color: #c4b5fd; font: 600 .875rem/1.2 system-ui, sans-serif;
        text-decoration: none;
      }
      .contract-link:hover { color: #fff; }
      #swagger-ui { max-width: 1440px; margin: 0 auto; padding: 0 clamp(.5rem, 2vw, 1.5rem) 3rem; }
      .swagger-ui { color: #e2e8f0; }
      .swagger-ui .topbar { display: none; }
      .swagger-ui .info .title, .swagger-ui .info p, .swagger-ui .info li,
      .swagger-ui .opblock-tag, .swagger-ui table thead tr th,
      .swagger-ui table thead tr td, .swagger-ui .parameter__name,
      .swagger-ui .parameter__type, .swagger-ui .response-col_status,
      .swagger-ui .model-title, .swagger-ui .model { color: #e2e8f0; }
      .swagger-ui .scheme-container, .swagger-ui section.models,
      .swagger-ui .opblock .opblock-section-header { background: #111b2c; }
      .swagger-ui input, .swagger-ui select, .swagger-ui textarea { background: #0b1120; color: #e2e8f0; }
      .swagger-ui .info .title small { background: #7c3aed; }
      @media (max-width: 600px) {
        .masthead { align-items: flex-start; flex-direction: column; }
      }
    </style>
  </head>
  <body>
    <header class="masthead">
      <div class="brand"><span>QARAGON</span> API REFERENCE</div>
      <a class="contract-link" href="/openapi.json">OpenAPI JSON <span aria-hidden="true">↗</span></a>
    </header>
    <main id="swagger-ui" aria-label="Qaragon API operations"></main>
    <script src="/docs-assets/swagger-ui-bundle.js"></script>
    <script src="/docs-assets/swagger-ui-standalone-preset.js"></script>
    <script>
      window.ui = SwaggerUIBundle({
        url: "/openapi.json",
        dom_id: "#swagger-ui",
        deepLinking: true,
        displayRequestDuration: true,
        filter: true,
        presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
        layout: "StandaloneLayout",
        defaultModelsExpandDepth: -1,
        docExpansion: "list",
        tryItOutEnabled: true,
      });
    </script>
  </body>
</html>
